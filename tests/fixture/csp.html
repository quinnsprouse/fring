<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- No inline styles and no <style> elements allowed. fring must not need either. -->
    <meta http-equiv="Content-Security-Policy" content="style-src 'none'" />
    <title>fring under a strict CSP</title>
  </head>
  <body>
    <p><a id="a" href="#a">first link</a></p>
    <p><a id="b" href="#b">second link</a></p>
    <script type="module">
      import { fring } from '../../src/index.ts'
      window.stop = fring()
    </script>
  </body>
</html>
